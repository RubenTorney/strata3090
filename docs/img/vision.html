text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.note{color:#52514e;font-size:12.5px;margin-top:10px}</style><div class=wrap style='width:1436px'><h1>Mode vision : une capture d'écran refaite en un seul fichier HTML</h1><p class=sub>Encodeur d'images sur le CPU (6 threads), réponse rendue dans Firefox</p><div style='display:flex;gap:14px'><figure style='margin:0;flex:1'><img src='../../bench/vision/site_hn.png' style='width:100%;border:1px solid #d9d8d3;display:block'><figcaption style='font-size:13px;margin-top:8px'><b>Capture envoyée au modèle</b><br><span style='color:#52514e'>page d'accueil de Hacker News, 1280 × 900</span></figcaption></figure><figure style='margin:0;flex:1'><img src='../../bench/vision/run1/hn_300.png' style='width:100%;border:1px solid #d9d8d3;display:block'><figcaption style='font-size:13px;margin-top:8px'><b>Refait avec 300 jetons d'image</b><br><span style='color:#52514e'>encodage CPU 2,7 s · 4 593 tokens à 148,9 tok/s · petit texte inventé</span></figcaption></figure><figure style='margin:0;flex:1'><img src='../../bench/vision/run1/hn_1024.png' style='width:100%;border:1px solid #d9d8d3;display:block'><figcaption style='font-size:13px;margin-top:8px'><b>Refait avec 1 024 jetons d'image</b><br><span style='color:#52514e'>encodage CPU 13,3 s · 5 284 tokens à 147,6 tok/s · texte presque exact</span></figcaption></figure></div><p class=note>Le HTML produit et les statistiques sont dans bench/vision/run1/.</p></div>
