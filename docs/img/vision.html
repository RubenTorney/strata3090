text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.note{color:#52514e;font-size:12.5px;margin-top:10px}</style><div class=wrap style='width:1436px'><h1>Vision mode: a screenshot rebuilt as a single HTML file</h1><p class=sub>Image encoder on the CPU (6 threads), answer rendered in Firefox</p><div style='display:flex;gap:14px'><figure style='margin:0;flex:1'><img src='../../bench/vision/site_hn.png' style='width:100%;border:1px solid #d9d8d3;display:block'><figcaption style='font-size:13px;margin-top:8px'><b>Screenshot sent to the model</b><br><span style='color:#52514e'>Hacker News front page, 1280 × 900</span></figcaption></figure><figure style='margin:0;flex:1'><img src='../../bench/vision/run1/hn_300.png' style='width:100%;border:1px solid #d9d8d3;display:block'><figcaption style='font-size:13px;margin-top:8px'><b>Rebuilt with 300 image tokens</b><br><span style='color:#52514e'>CPU encoding 2.7 s · 4,593 tokens at 148.9 tok/s · small text made up</span></figcaption></figure><figure style='margin:0;flex:1'><img src='../../bench/vision/run1/hn_1024.png' style='width:100%;border:1px solid #d9d8d3;display:block'><figcaption style='font-size:13px;margin-top:8px'><b>Rebuilt with 1,024 image tokens</b><br><span style='color:#52514e'>CPU encoding 13.3 s · 5,284 tokens at 147.6 tok/s · text almost exact</span></figcaption></figure></div><p class=note>The HTML produced and the statistics are in bench/vision/run1/.</p></div>
